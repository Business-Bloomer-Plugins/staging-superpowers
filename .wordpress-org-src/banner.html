<!doctype html>
<html><head><meta charset="utf-8">
<!-- WP.org banner, comic "Midnight" design (2026-10-04). Render with render-banner.py. Width sets the size: everything scales in cqw. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#0b1033;--navy:#000342;--rays:#0a1a7a;--yellow:#ffd60a;--cyan:#2ec4f0;--white:#fff}
body{background:var(--navy)}
#banner{container-type:inline-size;width:100vw;aspect-ratio:1544/500;position:relative;overflow:hidden;background-color:var(--navy);background-image:repeating-conic-gradient(from 0deg at 21% 56%,var(--rays) 0 7deg,transparent 7deg 14deg)}
#banner::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.08) 22%,transparent 24%);background-size:1cqw 1cqw}
.shield{position:absolute;width:22cqw;height:25cqw;left:10cqw;top:50%;transform:translateY(-46%) rotate(-7deg);z-index:1}
.shield svg{width:100%;height:100%;display:block;overflow:visible}
.copy{position:absolute;left:38cqw;right:4cqw;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:1.5cqw;z-index:1}
.title{font-family:Bangers,Impact,sans-serif;font-weight:400;color:var(--white);-webkit-text-stroke:.32cqw var(--ink);paint-order:stroke fill;text-shadow:.55cqw .55cqw 0 var(--ink);letter-spacing:.03em;line-height:.88;font-size:8cqw;transform:rotate(-2deg);transform-origin:left center}
.title b{font-weight:400;color:var(--yellow)}
.tagline{font:700 3.3cqw/1.1 "Comic Neue",sans-serif;color:var(--white)}
.powers{display:flex;flex-wrap:nowrap;gap:1.1cqw}
.power{white-space:nowrap;font:2.5cqw/1 Bangers,Impact,sans-serif;letter-spacing:.05em;color:var(--ink);background:var(--yellow);border:.25cqw solid var(--ink);padding:.65cqw 1.1cqw .5cqw;box-shadow:.35cqw .35cqw 0 var(--ink);display:inline-flex;gap:.6cqw;align-items:center}
.power:nth-child(2){background:var(--cyan)}.power:nth-child(3){background:var(--white)}
.power i{font-style:normal;font:700 2.1cqw/1 "Comic Neue",sans-serif}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="sh" viewBox="0 0 100 112"><path d="M50 4 L92 18 V54 C92 82 72 100 50 108 C28 100 8 82 8 54 V18 Z" transform="translate(4 4)" fill="#0b1033"/><path d="M50 4 L92 18 V54 C92 82 72 100 50 108 C28 100 8 82 8 54 V18 Z" fill="#2ec4f0" stroke="#0b1033" stroke-width="5" stroke-linejoin="round"/><path d="M50 14 L83 25 V54 C83 76 67 91 50 98 Z" fill="#ffffff" opacity=".35"/><path d="M57 20 L33 60 H49 L42 92 L70 48 H54 Z" fill="#ffd60a" stroke="#0b1033" stroke-width="4.5" stroke-linejoin="round"/></symbol></defs></svg>
<div id="banner">
<div class="shield"><svg><use href="#sh"/></svg></div>
<div class="copy">
<h1 class="title">Staging<br><b>Superpowers!</b></h1>
<p class="tagline">Live stays safe. Every time.</p>
<div class="powers"><span class="power">STOP <i>emails</i></span><span class="power">FREEZE <i>automations</i></span><span class="power">HIDE <i>from Google</i></span></div>
</div>
</div>
</body></html>
